name: Sausage Store Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NEXUS_HELM_REPO: ${{ secrets.NEXUS_HELM_REPO }}
  NEXUS_HELM_REPO_USER: ${{ secrets.NEXUS_HELM_REPO_USER }}
  NEXUS_HELM_REPO_PASSWORD: ${{ secrets.NEXUS_HELM_REPO_PASSWORD }}
  SAUSAGE_STORE_NAMESPACE: r-devops-magistracy-project-2sem-1575986773
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

jobs:
  build_and_push_to_docker_hub:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push Backend to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          tags: fetbubun/sausage-backend:latest
      - name: Push Frontend to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          tags: fetbubun/sausage-frontend:latest
      - name: Push Backend-report to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./backend-report/
          push: true
          tags: fetbubun/sausage-backend-report:latest

  add_helm_chart_to_nexus:
    name: Add Helm Chart To Nexus
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Install Helm
        uses: azure/setup-helm@v3
      - name: Package Helm chart
        run: helm package sausage-store-chart
      - name: Push Helm chart to Nexus
        run: |
          CHART_FILE=$(ls sausage-store-*.tgz)
          curl -u ${{ secrets.NEXUS_HELM_REPO_USER }}:${{ secrets.NEXUS_HELM_REPO_PASSWORD }} \
            --upload-file $CHART_FILE \
            ${{ secrets.NEXUS_HELM_REPO }}/$CHART_FILE

  deploy_helm_chart_to_kubernetes:
    name: Deploy Helm Chart To Kubernetes
    runs-on: ubuntu-latest
    needs: add_helm_chart_to_nexus
    steps:
      - name: Install Helm
        uses: azure/setup-helm@v3
      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Verify cluster access
        run: kubectl get ns "$SAUSAGE_STORE_NAMESPACE"
      - name: Add Nexus Helm repo
        run: |
          helm repo add nexus ${{ secrets.NEXUS_HELM_REPO }} \
            --username ${{ secrets.NEXUS_HELM_REPO_USER }} \
            --password ${{ secrets.NEXUS_HELM_REPO_PASSWORD }}
          helm repo update
      - name: Clean up old Helm release secrets
        continue-on-error: true
        run: |
          kubectl delete secrets -n $SAUSAGE_STORE_NAMESPACE \
            -l owner=helm,status=superseded --ignore-not-found
          kubectl delete secrets -n $SAUSAGE_STORE_NAMESPACE \
            -l owner=helm,status=failed --ignore-not-found
      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install sausage-store nexus/sausage-store \
            --namespace $SAUSAGE_STORE_NAMESPACE \
            --version 0.3.3 \
            --history-max 3 \
            --timeout 5m
